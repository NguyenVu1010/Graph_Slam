name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: git ls-files '*.cpp' '*.hpp' | xargs clang-format-18 --dry-run --Werror
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check . && ruff format --check .

  core-no-gtsam:
    # Thin runner: core + unit tests without GTSAM. Full build with GTSAM runs in docker below.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libeigen3-dev libgtest-dev libyaml-cpp-dev
      - uses: actions/cache@v4
        id: sophus-cache
        with:
          path: ~/opt/sophus
          key: sophus-1.22.10-ubuntu-24.04
      - name: Build Sophus 1.22.10
        if: steps.sophus-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 1.22.10 https://github.com/strasdat/Sophus.git /tmp/sophus
          cmake -S /tmp/sophus -B /tmp/sophus/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$HOME/opt/sophus \
            -DBUILD_SOPHUS_TESTS=OFF -DBUILD_SOPHUS_EXAMPLES=OFF -DSOPHUS_USE_BASIC_LOGGING=ON
          cmake --build /tmp/sophus/build
          cmake --install /tmp/sophus/build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMSS_WITH_GTSAM=OFF -DMSS_WERROR=ON -DCMAKE_PREFIX_PATH=$HOME/opt/sophus
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,eval]"
      - run: pytest

  docker-full:
    # ROS 2 Jazzy + GTSAM. Integration tests E-01..E-03 and PF-01 run here because this job
    # already builds GTSAM (tools/run_integration.py on the host, mss_bench inside the image,
    # workspace mounted at the same path). A separate integration.yml (ADR-009) follows once
    # deps-image.yml publishes the deps image. Results: step summary + artifact (no PR comment,
    # it would need a write token on fork PRs). A failed gate fails this job; each bench run
    # is also killed after 10 x the scenario duration by the harness.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/deps.Dockerfile -t mss-deps .
      - run: docker build -f docker/Dockerfile --build-arg DEPS=mss-deps -t mss .
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[eval]"
      - name: Preflight, mss_bench installed in the image
        run: docker run --rm mss test -x /ws/install/multi_sensor_slam/bin/mss_bench
      - name: Integration E-01..E-03, PF-01
        run: >
          python tools/run_integration.py
          --bench-cmd "docker run --rm -v ${{ github.workspace }}:${{ github.workspace }} -w ${{ github.workspace }} mss /ws/install/multi_sensor_slam/bin/mss_bench"
          --out ${{ github.workspace }}/results/ci-${{ github.run_id }} --plots
      - if: always()
        run: |
          f=results/ci-${{ github.run_id }}/summary.md
          if [ -f "$f" ]; then
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No integration summary (setup error or earlier failure; see the integration step log)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ github.run_id }}
          # Bench outputs, ate.json, plots, integration.json, summary.md; not the ~500 MB of
          # regenerable bags and datasets under data/.
          path: |
            results/ci-${{ github.run_id }}
            !results/ci-${{ github.run_id }}/data
