# E-07W (loop closure, ADR-026), loops on: warehouse_e07.yaml with loop_closure.enabled (PCM on by
# default, ADR-028). Keep every other key equal to warehouse_e07.yaml.
# Overlay on config/default.yaml for the simulated warehouse robot (ADR-011 section 5).
# Only keys that differ from default. Pipeline noise = sim noise x2 (SIM-03: within [1, inflation_max]).
mss_node:
  ros__parameters:
    frames:
      T_b_l:
        translation_m: [0.10, 0.0, 0.50]
        # 2 deg pitch about y: [cos 1deg, 0, sin 1deg, 0], Hamilton order (w, x, y, z), norm 1 within 1e-6.
        quaternion_wxyz: [0.99984770, 0.0, 0.01745241, 0.0]
      # Lever arm to the GNSS antenna in body, metres: |p| = 0.201 m, on top of the body box
      # (z = 0.15 m), behind and left of the IMU (ADR-011 amendment 2026-11-02, backlog L2).
      p_b_g_m: [-0.12, 0.06, 0.15]
    imu:
      # S5 owner ruling (H6): level start on in the loop scenes only; default.yaml keeps it off.
      init_level_start: true   # ADR-027
      gyro_noise_density: 3.5e-4  # rad/s/sqrt(Hz)
      acc_noise_density: 5.8e-3   # m/s^2/sqrt(Hz)
      gyro_random_walk: 2.0e-5    # rad/s^2/sqrt(Hz)
      acc_random_walk: 2.0e-4     # m/s^3/sqrt(Hz)
    gnss:
      enabled: false
      sigma_h_m: 1.5
      sigma_v_m: 3.0
    wheel_odom:
      enabled: true
      wheel_radius_m: 0.101   # believed, not true (0.10)
      track_m: 0.399          # believed, not true (0.40)
      speed_sigma_mps: 0.02
    lidar:
      range_sigma_m: 0.03
    loop_closure:
      enabled: true   # E-07W second run
      # Loop-scene settings (H6, E-07W; defaults unchanged):
      # A conservative covariance floor from the loop NEES against ground truth (C1-3,
      # loop_closure.md section 14; not a NEES-6 calibration). Loop overlays only (owner ruling).
      cov_floor_m: 0.02          # m
      cov_floor_deg: 0.25        # deg
      # ADR-030: a PCM-selected loop enters without the Cauchy kernel only with a partner loop
      # at another place (kernel_release_min_separation_m) and a correction within the drift
      # ratio of the distance travelled (default.yaml values).
      kernel_release: true
      # No place search and no wider gate here (review B-2): E-07W drifts centimetres, and the
      # rack aisles are the scene where a look-alike place is most likely.
