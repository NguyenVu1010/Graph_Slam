# Single source of tunables for bench, tests and ros2_node (installed to the package share).
# Every value has a unit in its key or a comment and is validated at start-up.
# New features ship behind a flag that defaults to the previous behaviour.
mss_node:
  ros__parameters:
    # Single-thread, fixed-seed mode so runs reproduce bit for bit.
    deterministic: true
    random_seed: 42

    frames:
      world: "map"
      body: "imu_link"     # b = IMU
      lidar: "lidar_link"  # l
      gnss: "gnss_link"    # g, antenna
      # T_b_l: LiDAR in body. Quaternion in Hamilton order (w, x, y, z).
      T_b_l:
        translation_m: [0.0, 0.0, 0.0]
        quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
      # T_b_o: wheel-odometry frame o in body (rig: base_link == imu_link). Hamilton (w, x, y, z).
      T_b_o:
        translation_m: [0.0, 0.0, 0.0]
        quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
      # p_b_g: GNSS antenna lever arm expressed in body, metres.
      p_b_g_m: [0.0, 0.0, 0.0]

    imu:
      rate_hz: 200.0
      # IMU noise: placeholder, replace from the datasheet of the real MPU; must stay >=
      # sim/noise values, see SIM-03 (tests/python/test_sim03_consistency.py). All > 0.
      acc_noise_density: 5.8e-3   # m/s^2/sqrt(Hz)
      gyro_noise_density: 3.5e-4  # rad/s/sqrt(Hz)
      acc_random_walk: 2.0e-4     # m/s^3/sqrt(Hz)
      gyro_random_walk: 2.0e-5    # rad/s^2/sqrt(Hz)
      gravity_mps2: 9.80665
      init_window_s: 2.0               # static window used for gravity/bias initialisation, s
      # Max accel std in the window to accept "static", m/s^2. Must exceed the per-sample
      # noise acc_noise_density * sqrt(rate_hz) (0.082 here) by about 3x; motion is far larger.
      init_max_acc_std_mps2: 0.3
      init_max_gyro_std_radps: 0.01    # max gyro std in the window to accept "static", rad/s
      # Rest gate of the keyframe-0 gravity factor (backend.static_gravity_factor, ADR-020): the
      # window std checks above accept a constant turn or a steady acceleration, so the factor
      # is only added when also |mean gyro| <= init_max_mean_gyro_radps (rad/s; above the gyro
      # bias: sim profile 0.035 rad/s 1-sigma, 0.15 = 4.3 sigma; a 0.25 rad/s turn fails), every
      # wheel speed in the window <= init_max_wheel_speed_mps (m/s, when wheel_odom.enabled;
      # above the wheel-speed noise at rest: 0.01 would gate E-01, whose still phase reads
      # speeds above 0.01 m/s from encoder quantization and noise, wheel_odom.speed_sigma_mps 0.02)
      # and ||f| - g| <= init_gravity_check_sigma x sqrt(sigma_mean^2 + prior_bias_acc^2)
      # (dimensionless; weak: a horizontal acceleration changes |f| only to second order).
      init_max_mean_gyro_radps: 0.15
      init_max_wheel_speed_mps: 0.1
      init_gravity_check_sigma: 3.0
      # Level start (ADR-027, docs/derivations/vertical_drift_study.md): the robot rests on a
      # level floor at initialisation, so the initial roll and pitch are 0 and the window's
      # mean specific force minus gravity is accelerometer bias. A static window cannot tell
      # tilt from horizontal bias (ADR-020); without this the bias b becomes a tilt b/g that
      # nothing corrects until the robot turns. Gazebo E-04, bias 0.59 m/s^2: tilt 59 -> ~0
      # mrad, end vertical error 0.95 -> ~0.03 m. Requires the IMU mounted level in b.
      init_level_start: false   # flag; off = roll/pitch from the window mean, bias 0
      # Level-start bound, m/s^2, > 0: a window whose horizontal mean |(a_x, a_y)| exceeds it
      # is a tilted start (ramp, mount), not bias; the flag-off initialisation is used and a
      # warning is logged. 0.75 = 2.5 x the accelerometer bias sigma per axis (0.3 m/s^2, sim
      # profile; MPU class): a level robot falls back with probability exp(-2.5^2 / 2) = 4.4 %
      # (Rayleigh). It allows a floor slope or mount tilt of at most asin(0.75 / g) = 4.4 deg
      # with zero bias (a 5 deg ramp, 0.85 m/s^2, falls back).
      init_level_max_bias_mps2: 0.75

    gnss:
      # Off until multipath (E-06) and outage (E-05) are evaluated end to end (CLAUDE.md DoD 3);
      # the sim scenarios enable it by overlay (config/sim/*.yaml). PR 4a evaluation with
      # backend.gnss_frame_variable and scan_match.cov_scale 4.7 (docs/derivations/
      # gnss_fusion_study.md section 11, ADR-019), ATE, GTSAM: box world 0.0090 m LiDAR only,
      # 0.0090 m with GNSS 0.5 m (fixed T_e_w: 0.0326 m); E-01 with GNSS 0.0022 m (fixed T_e_w
      # at cov_scale 1: 0.0709 m); degenerate corridor 15.4 m LiDAR only, 1.82 m with GNSS.
      enabled: false
      sigma_h_m: 1.5  # horizontal fix sigma, m
      sigma_v_m: 3.0  # vertical fix sigma, m
      max_cov_m2: 25.0  # gate: reject fixes whose per-axis variance exceeds this, m^2
      align_min_pairs: 10      # accepted fixes needed before the w->e alignment is used
      align_min_spread_m: 1.0  # min RMS horizontal spread of the fixes for alignment, m
      # Backlog G1: GnssAligner also waits until its predicted yaw 1-sigma is at most
      # align_yaw_max_sigma_deg (declared fix variance floored at align_yaw_min_var_m2; the
      # front-end positions taken as exact, gnss.md section 4.1). false: no yaw check (previous
      # behaviour). On E-01 (1.0 m fixes on a 1.67 m circle) the 1 m spread is reached at 13 s
      # with a 7.6 deg sigma and the yaw 21 deg off; the noise alone explains it (white, same
      # error on the true path). Evaluation: gnss_fusion_study.md section 17. On since G13
      # (owner decision 2026-10-29, ADR-025; false restores the previous behaviour): at the 6 deg
      # of align_yaw_max_sigma_deg E-01 aligns at 14.8 s after 4.4 m with the yaw 15.4 deg off
      # (2.6 sigma), 214 GNSS factors instead of 223; ATE E-01 0.002183 -> 0.002160 m, E-03
      # 0.002183 -> 0.002172 m (see docs/baselines/2026-10-29/). Box world and corridor
      # (15 seeds each) unchanged on every seed.
      align_check_yaw_sigma: true
      chi2_gate: 7.814727903251178  # chi-square 3 DoF at q = 0.95 (G-02 band 90-99 %), NIS
      # Lock-out guard: after this many chi-square rejections in a row (fixes) the aligner
      # restarts on the current front end (pipeline.md section 5). >= 1. Rule: the window must
      # exceed the longest expected multipath hold (ADR-011: steps held 2 to 10 s), or the
      # restart re-admits the multipath it rejected; 60 = 12 s at 5 Hz. E-06 evaluates it.
      max_consecutive_rejects: 60
      # ADR-022: keep the fixes received before the first alignment (the static ones of the IMU
      # initialisation window included) and add them as factors once aligned, each on its
      # nearest keyframe in time. false: they are dropped (previous behaviour). Evaluation
      # (gnss_fusion_study.md section 14, 15 paired seeds): corridor median abs(E - truth) along
      # the axis 0.82 -> 0.08 m, fused ATE median 1.99 -> 1.88 m (CI includes 0); box world
      # unchanged (0.01019 m both); E-01 0.002183 -> 0.002198 m. With the exact shift (study
      # oracle) the corridor gives 0.345 m, 14/1, CI excludes 0: off until design 3 (shift
      # covariance) is in.
      attach_prealign_fixes: false
      # Bound of that buffer, fixes (>= 1); 320 = 64 s at 5 Hz (about 175 KB, reserved only
      # when attach_prealign_fixes is true). Sizing rule: GNSS rate x (IMU initialisation window
      # + expected time to the first alignment). With align_yaw_from_track the alignment can
      # wait for the yaw sigma: on E-01 (1.5 m fixes on a 1.67 m circle) 264 fixes arrive before
      # it; 256 dropped 4, 320 none (gnss_fusion_study.md section 15.3). When full before
      # keyframe 0 the oldest fix is dropped (farthest from the static window), after it the new
      # one (so the static ones stay); both counted in Stats::n_gnss_prealign_dropped.
      prealign_max_fixes: 320
      # ADR-023: take the yaw of T_e_w from the direction of the GNSS track against the body
      # heading (gyro + LiDAR) instead of fitting front-end positions, whose along-axis part is
      # IMU dead reckoning in a degenerate corridor. false: GnssAligner (previous behaviour).
      # Evaluation (gnss_fusion_study.md section 15, 15 paired seeds): corridor seeds starting
      # > 10 deg off 2 -> 0 (max 2.5 deg). Fused ATE alone: median 1.99 -> 4.66 m, CI against
      # the reference includes 0, worse than raw GNSS (CI excludes 0); with
      # attach_prealign_fixes 1.66 m, max 37 -> 3.17 m, CI against the reference excludes 0.
      # Box world unchanged; E-01 0.002183 -> 0.002210 m with the design-2 keys (35 of 223 GNSS
      # factors), 0.002196 m with the design-2b defaults below (170). Direction of travel from the
      # wheel speed when wheel_odom is enabled, else the forward-driving assumption: then net
      # backward motion before the yaw is confident
      # aligns 180 deg off, and a parked robot whose GNSS wanders by 0.1 m per fix or more can
      # align on noise (0.2 m per fix: 16 of 100 runs). Assumes white, honestly declared fix
      # noise (floored below).
      # Off until design 3, then on together with attach_prealign_fixes (size
      # prealign_max_fixes to the alignment delay).
      align_yaw_from_track: false
      # Fixes per chunk of the track (>= 2); segments join consecutive chunk means. 10 = 2 s at
      # 5 Hz.
      align_yaw_chunk_fixes: 10
      # Predicted yaw 1-sigma needed before the track-yaw aligner returns T_e_w, deg (> 0).
      # Replaces align_min_pairs / align_min_spread_m when align_yaw_from_track is true. Also
      # GnssAligner's threshold when align_check_yaw_sigma is true.
      # Design 2b (gnss_fusion_study.md section 16, proposed): 3 -> 6. The graph refines E's
      # yaw after the alignment; at 3 / 4.5 / 6 deg the first yaw stayed within its sigma (none
      # beyond 3 sigma), no flip, no more rejections after it. With wheel data 2b aligns after 4 m
      # instead of 6 m (corridor), 4 m instead of 7 m (box), 9 m instead of 23 m (E-01).
      # Straight-track rule at 0.5 m fixes: 0.224 m / sigma between the first and last chunk.
      align_yaw_max_sigma_deg: 6.0
      # Along-heading GNSS track needed before the track-yaw aligner returns T_e_w, m (> 0).
      # sigma_yaw assumes white, correctly declared fix noise; this bounds the effect of coloured
      # error (multipath, slow drift of a parked receiver): a 0.3 m common error over 5 m of
      # track is 3.4 deg. With the coherence below, a parked receiver drifting by 0.05 m per
      # fix never aligns (0 of 100 runs, 5 min); without wheel data, 0.2 m per fix aligns in
      # 16 of 100 (gnss.md section 5).
      align_yaw_min_track_m: 5.0
      # Along-heading track over the GNSS path length of the segments used, in (0, 1]: about 1
      # for steady motion, about 1 / sqrt(segments) for a parked receiver whose error wanders.
      align_yaw_min_coherence: 0.5
      # Turn gate: a segment whose heading change, or the heading span of either of its
      # chunks, exceeds this is not used (course over ground is unreliable in turns), deg,
      # (0, 180]. 45 keeps a 2 m circle at 0.25 rad/s (29 deg per chunk) and E-01 (34 deg).
      align_yaw_max_turn_deg: 45.0
      # Floor on the declared horizontal fix variance used for the yaw sigma, m^2 (> 0); a
      # declared variance <= 0 is rejected (GnssAligner, align_check_yaw_sigma: floored).
      # 0.25 = (0.5 m)^2.
      align_yaw_min_var_m2: 0.25
      # With wheel odometry, the sign of the wheel travel between two chunk centres gives the
      # direction of travel of a segment; below this travel (m, > 0) the segment is taken as
      # stationary and not used (wheel noise at rest has a random sign). 0.2 m is a fifth of a
      # 2 s segment at 0.5 m/s. Consequence: with wheel data a robot slower than about 0.1 m/s
      # (0.2 m per 2 s chunk interval) never aligns at these defaults.
      align_yaw_min_wheel_travel_m: 0.2
      # A segment whose along-heading motion is below -this x its sigma, once the yaw is within
      # the threshold above, is taken as reverse motion (> 0, sigmas).
      align_yaw_reverse_nsigma: 3.0
      # ADR-023 amendment (design 2b): with wheel data, a segment the turn gate rejects takes its
      # direction from the path of the odometry frame (frames.T_b_o) integrated from the wheel
      # travel along its heading (gnss.md section 5.1) instead of being skipped. false: skipped
      # (design 2). Aisles with 90 deg corners: at 3 deg 2 of 200 runs aligned without it, all
      # with it (7.9 m); never used without wheel data.
      align_yaw_wheel_turns: true
      # 1-sigma wheel travel error, fraction of the path along and across the motion (slip,
      # skid), fully correlated within a chunk, in (0, 1). A skid held through a long one-way
      # turn is outside this model (gnss.md section 5.1).
      align_yaw_wheel_slip_frac: 0.05
      # Along-heading track needed to align when every segment used has its direction from
      # wheel data, m (>= 0); else align_yaw_min_track_m applies. 3 m from the absolute-error
      # envelope at 6 deg (gnss.md section 5.1): against 0 m it halves the runs beyond 15 deg
      # with 0.05 m per fix of GNSS drift (52 -> 30 of 600) and the stuck-wheel alignments at
      # 0.2 m per fix (37 -> 16 of 100, before the consistency window below), for 2 s more at
      # 0.5 m/s.
      align_yaw_min_track_wheel_m: 3.0
      # Wheel/GNSS consistency (gnss.md section 5.1). When the GNSS track and the wheel travel
      # disagree by more than their noise plus align_yaw_wheel_slip_frac (wheels turning on a
      # still robot, slipping, a wrong odometer scale; counted in Stats::n_gnss_wheel_mismatch),
      # no transform until the segments since then agree with the wheels over this wheel travel,
      # m (> 0); they then replace all segments. 10 m: wheels spinning on a still robot with
      # 0.2 m per fix of GNSS drift align on 4 of 100 runs of the window-length probe (6 m: 16,
      # 3 m: 83; 1 to 7 of 100 across seed sets) where the LiDAR does not observe the travel
      # axis (none where it does, align_yaw_frontend_travel); after 30 / 60 /
      # 300 s of spinning the robot aligns after a median 10 m of driving (before: 16 / 31 /
      # 150 m), yaw within its sigma.
      align_yaw_wheel_restart_m: 10.0
      # Root-cause study of the residual limits (gnss_fusion_study.md section 16.13).
            # A run of at most this many fixes without an odometer reading is bridged by the next
      # reading instead of leaving the chunk half without wheel data, fixes (>= 0,
      # < align_yaw_chunk_fixes / 2; 0: never bridged). The pipeline integrates wheel speed and
      # interpolates across a wheel-message gap, so a bridged step is an estimate (backlog F1). 4: after wheels spun on a
      # still body, with 2 % / 10 % / 20 % of readings missing the robot aligns after a median
      # 10.9 m (max 16.9 / 15.9 / 21.9 m) instead of 36 m (max 311 m) / never / never.
      align_yaw_wheel_max_gap_fixes: 4
      # A stationary segment (less than align_yaw_min_wheel_travel_m of travel) is extended over
      # up to this many more chunks, so a slow robot's travel adds up, chunks (>= 0; 0: never).
      # 10 (20 s): with wheel data a robot at 0.02 to 0.08 m/s aligns after about 3 m instead of
      # never; slower than about 0.01 m/s it still never aligns.
      align_yaw_merge_max_chunks: 10
      # When the LiDAR observes the travel axis, the front-end displacement makes a segment
      # stationary (wheels turning on a still body, a parked robot), gives the direction of travel
      # without wheel data, and gives the path of a turn (a skid included). false: not used.
      align_yaw_frontend_travel: true
      # A scan observes the travel axis with at least this many robust-weighted point-to-plane
      # constraints along it (x^T H_rho x of the scan matcher, dimensionless, > 0). Measured per
      # scan: box world 239 to 466, E-01 304 to 577, box-world corridor 0.2 to 66.
      align_yaw_frontend_min_info: 100.0
    wheel_odom:
      enabled: false
      wheel_radius_m: 0.10     # m
      track_m: 0.40            # wheel separation, m
      speed_sigma_mps: 0.02    # wheel speed sigma, m/s
      yaw_rate_sigma_radps: 0.02  # per-sample yaw-rate sigma, rad/s
    lidar:
      range_sigma_m: 0.03  # range noise sigma, m

    preprocess:
      min_range_m: 0.5           # drop returns closer than this (robot body), m
      max_range_m: 100.0         # drop returns farther than this, m
      downsample_voxel_m: 0.5    # voxel-grid edge for scan downsampling, m
      deskew_enabled: true       # undistort points to t_start with the IMU trajectory

    map:
      voxel_m: 0.5               # map voxel edge, m (ADR-007)
      max_points_per_voxel: 20   # points kept per voxel
      # Spacing radius inside a voxel, m; a closer new point replaces the nearest stored one;
      # 0 = off (ADR-007 amendment, evaluation in map.md). Memory and speed option: at
      # 0 / 0.05 / 0.1 / 0.2 m E-01 ATE 0.95 / 0.87 / 0.91 / 1.27 mm (shipped gates), S-02 edge
      # bias 9.5 / 9.5 / 0.38 / 421 mm (gates off); 0.1 m: about 30 % fewer map points.
      min_point_dist_m: 0.0
      knn_k: 5                   # neighbours used to fit a plane
      prune_radius_m: 100.0      # voxels farther than this from the body are removed, m
      prune_period_s: 5.0        # how often pruning runs, s
      max_voxels: 500000         # hard cap on voxel count (memory bound on Pi5, ADR-007)
      keyframe_voxel_m: 0.5      # extra downsampling of keyframe clouds in the store, m (ADR-016)
      max_keyframes: 1000        # keyframe store bound (about 36 MB at 3k points/keyframe, ADR-016)
      window_keyframes: 50       # keyframes rebuilt into the VoxelMap cache after a correction (ADR-016)
      rebuild_trans_m: 0.05      # rebuild when the oldest window keyframe moved more than this, m
      rebuild_rot_deg: 0.5       # or rotated more than this, deg (radians in code)

    map_export:
      # Global map export (Estimator::export_map, mss_bench --map-out; ADR-016 amendment
      # 2026-10-29): every stored keyframe cloud at its optimised pose, in w. Edge of the
      # centroid voxel grid applied to the exported points, m: 0 = off (no extra downsampling;
      # the store already holds clouds at map.keyframe_voxel_m), otherwise >= 0.001 (1 mm).
      # Off the hot path.
      voxel_m: 0.0

    scan_match:
      max_iterations: 10         # Gauss-Newton iterations per scan
      rot_tol_rad: 1.0e-4        # convergence: rotation update norm, rad
      trans_tol_m: 1.0e-3        # convergence: translation update norm, m
      max_corr_dist_m: 1.0       # reject correspondences farther than this, m
      plane_rms_max_m: 0.05      # reject neighbourhoods whose plane fit RMS exceeds this, m
      # Plane-fit gates (ADR-007 amendment, scan_match.md section 3), dimensionless in [0, 1),
      # 0 = off; evaluated, off by default. planarity: reject lambda_min > ratio * lambda_mid
      # (two faces across an edge). On noise-free sim data 0.01 gave E-01 2.20 -> 0.95 mm, but
      # the ratio compares range noise with patch spread: at 1 cm noise about half of planar
      # 5-NN patches are rejected at 0.01. On the ov_plain replay (non-ideal map) 0.01 gave
      # ATE 14.8 -> 24.0 mm and scan p95 6.1 -> 11.5 ms (0.05: 14.5 mm, 5.5 ms). Its corridor
      # axis-leak cut (1.1 -> 0.10 %) is conditioning only: fused corridor ATE 1.8 -> 5.2 m.
      # To enable it on real data, use a noise-aware form such as
      # lambda_min > rho * lambda_mid + n * (k * sigma_range)^2.
      plane_min_eig_ratio: 0.0
      # collinearity: reject lambda_mid <= ratio * lambda_max (lines, thin strips). Off: at 0.2
      # it removes the S-02 edge bias (0.28 mm) but rejects the thin wall strips of a 5 m wide
      # corridor (LiDAR-only drift 11.5 -> 241 m with planarity 0.05) and, with planarity
      # 0.05, fails the no-GTSAM NEES bound (2.83 < 3) and CorridorDriftCorrectedByGnss.
      min_mid_eig_ratio: 0.0
      robust_huber_delta_m: 0.1  # Huber kernel threshold on point-to-plane residual, m
      min_inliers: 100           # fewer inliers than this -> match fails
      # Multiplier on the inverse-Hessian covariance (dimensionless). 4.7: with 1.0 the LiDAR
      # factor NEES on the box world was 28 for an expected 6 (docs/derivations/
      # gnss_fusion_study.md section 3); test LidarFactorCovarianceConsistent keeps it in [3, 12].
      cov_scale: 4.7
      min_residual_sigma_m: 0.005  # floor on the residual sigma used for the covariance, m
      # Cov along a degenerate direction ("unobserved"; docs/derivations/degeneracy.md section 7,
      # absolute detector, corridor replay along-axis RMS with wheel / IMU only, main 3f90e34 with
      # the ADR-020 gravity-direction factor and the ADR-021 decoupled relative factor): 1e-4 m^2
      # -> 3.4 mm / 0.073 m, 0.001 -> 3.8 mm / 0.021 m, 0.01 -> 3.9 mm / 0.14 m, 0.1 -> 3.9 mm /
      # 2.2 m, 1.0 -> 3.9 mm / 0.82 m; degeneracy off 0.30 m / 6.1 m.
      # On the recorded Gazebo E-04 bag the default is below the floor relax_factor * c /
      # eig_threshold (about 1.2e-3 m^2 there), so it gives the pre-PR-4b relaxed covariance;
      # 0.01 / 0.1 m^2 gave 0.41 / 0.34 m ATE there, but one chaotic bag does not choose a value.
      # Kept at 0.001 (owner decision); retune over several Gazebo recordings in S2, candidate
      # 0.01 m^2 (section 7).
      unobserved_var_m2: 0.001   # m^2 (3.2 cm std per keyframe step)
      unobserved_var_rad2: 1.0e-4  # rad^2 (0.57 deg std)

    degeneracy:
      # Evaluated on main 3f90e34 (docs/derivations/degeneracy.md section 7), kept OFF (owner
      # decision; retune in S2). Absolute 100 flags the corridor axis of the box-world corridor
      # (along-axis 3.8 mm with wheel, off 0.30 m) but costs E-01 2.18 -> 2.45 mm and box
      # GNSS + wheel 5.4 -> 6.0 mm, and on the Gazebo E-04 bag it lifts z by about 1.1 m at
      # start-up (S2 item).
      enabled: false             # flag (D-03)
      eig_threshold: 100.0       # absolute eigenvalue of H below which a direction is degenerate
      # >= 1. Floor of the unobserved variance: relax_factor * c / eig_threshold, with
      # c = cov_scale * max(sigma_r^2, min_residual_sigma_m^2) (the pre-PR-4b relaxed value);
      # also the factor of degeneracy::relax_covariance.
      relax_factor: 10.0

    loop_closure:
      # ADR-026, docs/derivations/loop_closure.md. Off by default until evaluated (CLAUDE.md).
      # Runs at keyframe time on the estimator thread: radius search on the backend's
      # optimised keyframe positions, Scan Context yaw, point-to-plane ICP against a submap of
      # the candidate, acceptance gates, then a Cauchy-wrapped relative factor (ADR-021 form).
      enabled: false
      search_radius_m: 10.0      # candidate keyframes within this distance, m (drift beyond it is not found)
      min_time_gap_s: 30.0       # candidates must be at least this much older, s
      max_candidates: 1          # candidates verified per keyframe, nearest first (>= 1)
      min_interval_keyframes: 5  # keyframes skipped after an accepted loop (>= 0)
      submap_keyframes: 2        # store neighbours on each side of the candidate in the submap
      submap_max_voxels: 20000   # voxels reserved for the submap (memory bound)
      # Scan Context (Kim & Kim 2018) in the gravity-levelled body frame: rings x sectors,
      # value = max height + sc_height_offset_m, cells <= 0 empty. One sector = 360 / sc_sectors
      # deg (6 deg at 60).
      sc_rings: 20
      sc_sectors: 60             # >= 4
      sc_max_range_m: 40.0       # m, horizontal range of the descriptor
      # m, > 0. Below the body height above the ground, so ground returns are empty and only
      # structure counts (with ground in every cell all places look alike). Sim robot: body
      # (IMU) on the wheel axle, 0.10 m above the ground.
      sc_height_offset_m: 0.05
      sc_max_distance: 0.4       # column-cosine distance gate in (0, 1]
      # ICP verification: scan_match.* with these overrides (wider basin than tracking).
      icp_max_iterations: 30
      icp_max_corr_dist_m: 2.0   # m
      # Acceptance after ICP: inlier = nearest submap point within inlier_dist_m and a plane
      # through its map.knn_k neighbours; residual = distance to that plane.
      inlier_dist_m: 0.5         # m (the stored clouds are spaced by map.keyframe_voxel_m)
      min_inlier_ratio: 0.6      # in (0, 1]
      max_rms_m: 0.08            # m, point-to-plane RMS of the inliers
      # Smallest eigenvalue of the ICP Hessian (units of MatchResult::H); below it the loop is
      # degenerate. Lower than degeneracy.eig_threshold (100, full scans): stored keyframe
      # clouds hold fewer points (map.keyframe_voxel_m).
      min_hessian_eig: 20.0
      # Largest ICP correction of the query pose against its graph pose: drift the graph may
      # have accumulated since the candidate. Larger: a symmetric false fit (a rectangular room
      # matched 180 deg off), discarded. Drift beyond these is not closed (ADR-026).
      max_correction_m: 3.0      # m
      max_correction_deg: 30.0   # deg (radians in code)
      # Floor of the loop covariance (C >= diag(floor^2) in the PSD sense); the ICP inverse
      # Hessian alone is mm-level and would make a wrong loop rigid before the kernel acts.
      cov_floor_m: 0.05          # m
      cov_floor_deg: 1.0         # deg (radians in code)
      isam_extra_updates: 2      # extra iSAM2 updates after the one that adds a loop (>= 0)

    backend:
      keyframe_dist_m: 1.0           # new keyframe after this translation, m (ADR-004)
      keyframe_rot_deg: 10.0         # new keyframe after this rotation, deg (radians in code)
      relinearize_threshold: 0.1     # iSAM2 relinearisation threshold (tangent norm)
      relinearize_skip: 1            # iSAM2 relinearises every N updates
      prior_pos_sigma_m: 0.1               # first-keyframe prior on position, m
      prior_rot_sigma_deg: 1.0             # first-keyframe prior on rotation, deg (radians in code)
      prior_vel_sigma_mps: 0.1             # first-keyframe prior on velocity, m/s
      prior_bias_acc_sigma_mps2: 0.1       # first-keyframe prior on accelerometer bias, m/s^2
      prior_bias_gyro_sigma_radps: 0.01    # first-keyframe prior on gyroscope bias, rad/s
      # Keyframe 0 also gets the gravity direction of the static init window: the mean
      # specific force f_b against ba - R^T g, projected normal to f_b (tilt against
      # horizontal bias, no magnitude), noise = static_gravity_sigma_scale x the window std of
      # the mean (docs/derivations/imu_only_observability.md sections 10-13; ADR-020). Start
      # stationary: imu.init_max_* gate it (a steady straight acceleration passes: <= +2.2 %
      # ATE in the tests, undetectable in a blind corridor).
      # Seeds 42-56 paired with main (off), scale 2 (median, wins/losses): IMU-only corridor
      # with x unobserved, end x err 21.7 -> 1.45 m (14/1) circle, 3.56 -> 2.72 m (10/5)
      # straight (3.9 sigma_DR: misses 3 sigma_DR); along-x RMS 11.6 -> 1.36 m, 1.85 -> 1.34 m;
      # box LiDAR NEES 7.49 -> 8.57 (6/9, 95 % CI of the difference [-0.39, +2.09]); 60 s
      # corridors within the spread (GNSS 3.03 -> 1.85 m, LiDAR only 24.9 -> 38.3 m, CIs
      # contain 0). Scale 1: NEES 9.42; scale 3: NEES 7.51 but straight 3.85 m. Check off.
      static_gravity_factor: true
      static_gravity_sigma_scale: 2.0      # dimensionless, > 0
      # Consistency check (ADR-020), evaluated and OFF (0). With a value > 0 the factor is
      # removed from iSAM2 after that many keyframes when its innovation statistic against the
      # rest of the graph exceeds static_gravity_chi2_gate (chi-square 2 DoF, 0.95: 5.991)
      # (Stats n_gravity_factor_removed; not evaluable: n_gravity_factor_unchecked, kept).
      # Off because at keyframe 5 it removed the factor at rest in 6 of 15 GNSS-corridor and
      # 2 of 15 LiDAR-only runs (statistic 14 to 147), overlapping the starts in motion (38 to
      # 233) (imu_only_observability.md sections 10g and 12).
      static_gravity_check_keyframes: 0    # 0 = off (shipped); >= 0
      static_gravity_chi2_gate: 5.991464547107979
      # Form of the LiDAR and loop relative-pose factors (backend_factors.md section 5).
      # Default decoupled per ADR-021: translation and rotation residuals separate, exact
      # Jacobians, the chart the scan-match covariance is computed in. between
      # (gtsam::BetweenFactor<Pose3>, approximate Jacobian, the behaviour before ADR-021) and
      # se3_exact (the SE(3) Log residual, exact Jacobians) remain selectable for comparison.
      relative_factor: decoupled
      # ADR-019: T_e_w is one graph variable shared by all GNSS factors (false: the aligner's
      # T_e_w frozen in each factor, which made the box world 3.7x worse,
      # docs/derivations/gnss_fusion_study.md). Its prior, centred on the aligner's first
      # T_e_w: roll/pitch tight (T_e_w is 4-DoF), yaw and translation loose. All > 0.
      gnss_frame_variable: true
      gnss_frame_tilt_sigma_deg: 0.01      # deg (radians in code)
      gnss_frame_yaw_sigma_deg: 30.0       # deg (radians in code)
      gnss_frame_pos_sigma_m: 10.0         # m

    realtime:
      scan_queue_depth: 2            # bounded scan queue; full -> drop oldest (ADR-005)
      imu_queue_depth: 400           # bounded IMU queue, samples
      aux_queue_depth: 32            # bounded GNSS / wheel queues, messages
      max_points_per_scan: 65536     # ScanFrame capacity reserved once, points
      pin_cores: false               # pin estimator threads to cores (Pi5)
      priority: 0                    # SCHED_FIFO priority, 0 = default scheduler
