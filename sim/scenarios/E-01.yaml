# E-01: warehouse lap, nominal GNSS (ADR-011 section 5).
id: E-01
world: warehouse
profile: sim/noise/default.yaml
pipeline_config: config/sim/warehouse.yaml
trajectory: sim/trajectories/warehouse_lap_60s.yaml
seed: 42
duration_s: 60
origin_lla: [21.0278, 105.8342, 12.0]  # lat_deg, lon_deg, alt_m
gnss:
  - {mode: nominal, t_start_s: 0, t_end_s: 60}
gnss_zones: []
topics:
  - /lidar/points
  - /imu/data
  - /gnss/fix
  - /wheel/odom
  - /ground_truth
  - /tf_static
  - /clock
prep:                      # synthetic data for the integration harness (ADR-011 part A)
  static_s: 5.0            # still phase for IMU initialisation
  ramp_s: 2.0              # speed ramp after the still phase
  speed_mps: 0.5           # cruise speed V
  omega_radps: 0.3         # yaw rate W; circle radius R = V / W
  box_half_m: [8.0, 5.0, 2.0]  # floor and ceiling inside the +-15 deg beams
  mutate:                  # E-03 only: what mutate_bag.py does to the E-01 bag
    drop_fraction: 0.05
    reorder_fraction: 0.02
    window_ns: 20000000    # reorder only neighbours closer than 20 ms
    seed: 42
